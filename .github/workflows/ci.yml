name: CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Pushes run migrations; never cancel those mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ams
          POSTGRES_PASSWORD: ams
          POSTGRES_DB: amscubing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ams -d amscubing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Migrate database
        env:
          DATABASE_URL: postgresql://ams:ams@localhost:5432/amscubing
        run: pnpm db:migrate

      - name: Build
        env:
          DATABASE_URL: postgresql://ams:ams@localhost:5432/amscubing
          BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_WEB_URL: http://localhost:3000
          NEXT_PUBLIC_CALENDAR_URL: http://localhost:3001
          NEXT_PUBLIC_BOARDS_URL: http://localhost:3002
          NEXT_PUBLIC_COURSES_URL: http://localhost:3003
          NEXT_PUBLIC_BLOG_URL: http://localhost:3004
          WCA_CLIENT_ID: ci
          WCA_CLIENT_SECRET: ci
          RESEND_API_KEY: ci
          NODE_ENV: production
        run: pnpm build

  migrate:
    name: Apply Drizzle migrations
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL_STAGING }}
        run: pnpm db:migrate

      - name: Sync AMS board template
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL_STAGING }}
        run: pnpm db:sync-template
